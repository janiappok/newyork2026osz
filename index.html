<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NYC Companion 2026</title><style>body{font-family:system-ui,sans-serif;background:#f5f7f8;color:#17324d;display:grid;place-items:center;min-height:100vh;margin:0}main{text-align:center;padding:24px}p{color:#677986}</style></head><body><main><h1>NYC Companion 2026</h1><p id="status">A weboldal betöltése…</p></main><script>
(async()=>{try{
const paths=Array.from({length:32},(_,i)=>'assets/site-part-'+String(i+1).padStart(3,'0')+'.txt');
const parts=await Promise.all(paths.map(async p=>{const r=await fetch(p,{cache:'no-cache'});if(!r.ok)throw new Error(p+': '+r.status);return r.text()}));
const page=parts.join('');
if(!page.trimStart().toLowerCase().startsWith('<!doctype html>')||!page.includes('</html>'))throw new Error('Hiányos weboldal');
document.open();document.write(page);document.close();
}catch(err){document.getElementById('status').textContent='A betöltés sikertelen: '+err.message;console.error(err)}})();
</script></body></html>
